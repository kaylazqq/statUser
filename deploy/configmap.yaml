apiVersion: v1
kind: ConfigMap
metadata:
  name: topic-participant-stats-config
  namespace: colink-apps
data:
  PORT: "8080"
  COLINK_ISSUER: "REPLACE_WITH_TRUSTED_HTTPS_PLATFORM_ORIGIN"
  COLINK_HOST_ORIGIN: "REPLACE_WITH_TRUSTED_HTTPS_HOST_ORIGIN"
  COLINK_APP_ORIGIN: "REPLACE_WITH_HTTPS_APP_ORIGIN"
  COLINK_STATE_FILE: "/data/stats.state"
  STATS_MAX_CONCURRENCY: "32"
